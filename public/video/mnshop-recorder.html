const canvas=document.querySelector('#hero');
const ctx=canvas.getContext('2d',{alpha:false});
const W=canvas.width,H=canvas.height,secondsPerSlide=2.4,duration=sources.length*secondsPerSlide;
const assets=await Promise.all(sources.map(src=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=src})));
const clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v));
const smooth=v=>{const x=clamp(v);return x*x*(3-2*x)};

function cover(image,x,y,w,h,scale=1){
  const ratio=Math.max(w/image.naturalWidth,h/image.naturalHeight)*scale;
  const dw=image.naturalWidth*ratio,dh=image.naturalHeight*ratio;
  ctx.drawImage(image,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}

function scene(image,progress,alpha,index){
  ctx.save();ctx.globalAlpha=alpha;
  ctx.filter='blur(34px) brightness(.34) saturate(.78)';
  cover(image,-55,-55,W+110,H+110,1.12+progress*.025);
  ctx.filter='none';ctx.fillStyle='rgba(3,5,11,.60)';ctx.fillRect(0,0,W,H);
  const warm=index>=3||index===1||index===2;
  const glow=ctx.createRadialGradient(1390,540,80,1390,540,670);
  glow.addColorStop(0,warm?'rgba(242,72,46,.19)':'rgba(53,112,255,.22)');
  glow.addColorStop(.55,warm?'rgba(172,77,35,.08)':'rgba(70,50,200,.08)');
  glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(700,0,1220,H);
  const ease=smooth(progress),size=1010*(1+ease*.042);
  const drift=(ease-.5)*(index%2===0?34:-30),x=850+drift,y=(H-size)/2+Math.sin(progress*Math.PI)*5;
  ctx.shadowBlur=54;ctx.shadowColor=warm?'rgba(255,76,45,.30)':'rgba(77,119,255,.34)';
  ctx.drawImage(image,x,y,size,size);ctx.restore();
}

function draw(time){
  const wrapped=((time%duration)+duration)%duration,position=wrapped/secondsPerSlide;
  const index=Math.floor(position)%assets.length,next=(index+1)%assets.length,progress=position-Math.floor(position);
  const transition=progress>.76?smooth((progress-.76)/.24):0;
  ctx.fillStyle='#04060b';ctx.fillRect(0,0,W,H);
  scene(assets[index],progress,1-transition,index);
  if(transition>0)scene(assets[next],transition*.16,transition,next);
  const left=ctx.createLinearGradient(0,0,1430,0);
  left.addColorStop(0,'rgba(0,0,0,.98)');left.addColorStop(.34,'rgba(0,0,0,.82)');
  left.addColorStop(.68,'rgba(0,0,0,.16)');left.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=left;ctx.fillRect(0,0,W,H);
  const scanX=610+progress*1360,scan=ctx.createLinearGradient(scanX-100,0,scanX+120,0);
  scan.addColorStop(0,'rgba(20,80,255,0)');scan.addColorStop(.46,'rgba(95,165,255,.08)');
  scan.addColorStop(.5,'rgba(255,255,255,.18)');scan.addColorStop(1,'rgba(20,80,255,0)');
  ctx.globalCompositeOperation='screen';ctx.fillStyle=scan;ctx.fillRect(scanX-100,0,220,H);ctx.globalCompositeOperation='source-over';
  const vignette=ctx.createLinearGradient(0,0,0,H);
  vignette.addColorStop(0,'rgba(0,0,0,.70)');vignette.addColorStop(.22,'rgba(0,0,0,0)');
  vignette.addColorStop(.74,'rgba(0,0,0,0)');vignette.addColorStop(1,'rgba(0,0,0,.72)');
  ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
}

draw(5);
const poster=document.createElement('img');poster.id='poster';poster.src=canvas.toDataURL('image/jpeg',.88);poster.hidden=true;document.body.appendChild(poster);
draw(0);
const stream=canvas.captureStream(30);
const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm;codecs=vp8';
const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:9000000});
const chunks=[];recorder.ondataavailable=event=>{if(event.data.size)chunks.push(event.data)};
const finished=new Promise(resolve=>recorder.onstop=resolve);recorder.start(500);
const started=performance.now();
await new Promise(resolve=>{function animate(now){const elapsed=(now-started)/1000;draw(Math.min(elapsed,duration-1/30));if(elapsed<duration)requestAnimationFrame(animate);else resolve()}requestAnimationFrame(animate)});
recorder.stop();await finished;
const video=new Blob(chunks,{type:mime});
const videoUrl=URL.createObjectURL(video);
const result=document.createElement('video');result.id='result';result.src=videoUrl;result.mnshopBlob=video;result.hidden=true;document.body.appendChild(result);
const download=document.createElement('a');download.id='download';download.href=videoUrl;download.download='mnshop-product-hero.webm';download.textContent='Download MNShop hero';download.style.cssText='position:fixed;left:20px;bottom:20px;z-index:5;padding:12px 18px;background:#1769ff;color:white;font:600 14px sans-serif;text-decoration:none;border-radius:6px';document.body.appendChild(download);
document.title='MNShop Hero: complete';
</script>
